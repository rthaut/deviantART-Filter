name: changerelease
on:
  workflow_dispatch: {}
  push:
    paths: [CHANGELOG.md]
    branches: [master]
    tags: ["*"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: dropseed/changerelease@3b121c9e98fa055f59a32b023cb4fd2325f4d9dc # v1.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_prefix: v
        changelog: CHANGELOG.md
